# SQL Editor Backend - Uygulama Konfigürasyonu
server.port=8080

# Uygulamanın kendi veritabanı. Hedef SQL sunucularından ayrıdır.
spring.datasource.url=${APP_DB_URL:jdbc:mysql://localhost:3306/sqleditor_app?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Istanbul}
spring.datasource.username=${APP_DB_USERNAME:sqleditor_app}
spring.datasource.password=${APP_DB_PASSWORD:change-this-app-password}
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.enabled=true

# Üretimde bu iki değer mutlaka ortam değişkeni olarak verilmelidir.
# Geliştirme ortamı için rastgele anahtarlar tanımlandı.
app.jwt.secret=${JWT_SECRET:dev-secret-4b2a7f8e3c1d9b6a5f4e2d1c8b7a6f9e3d2c1b}
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=7
app.credentials.encryption-key=${CREDENTIAL_ENCRYPTION_KEY:tNubymsrnLsf4+DX8DFLWFt6W17GADQFio/ko9Sx3PA=}
app.connection.session-minutes=60
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Logging
logging.level.com.sqleditor=DEBUG
logging.level.org.springframework.web=INFO

# Jackson JSON - Türkçe karakter desteği
spring.jackson.default-property-inclusion=non_null

# Java 21 Virtual Threads (Project Loom) Desteği
spring.threads.virtual.enabled=true
