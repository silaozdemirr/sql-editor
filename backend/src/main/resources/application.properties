# SQL Editor Backend - Uygulama Konfigürasyonu
server.port=8080

# Spring boot auto-config - datasource'u devre dışı bırak
# (biz manuel JDBC connection yapıyoruz)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Logging
logging.level.com.sqleditor=DEBUG
logging.level.org.springframework.web=INFO

# Jackson JSON - Türkçe karakter desteği
spring.jackson.default-property-inclusion=non_null
