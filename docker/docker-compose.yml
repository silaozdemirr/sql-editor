services:
  mysql:
    image: mysql:8.0
    container_name: sqleditor-mysql
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_DATABASE: okul_db
      MYSQL_USER: sqleditor
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    secrets:
      - db_root_password
      - db_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$(cat /run/secrets/db_root_password)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  oracle:
    image: gvenzl/oracle-free:slim
    container_name: sqleditor-oracle
    environment:
      - ORACLE_PASSWORD=oracle123
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqleditor-mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Mssql_Strong_Pass123!
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Mssql_Strong_Pass123!", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: sqleditor-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: kitaplik_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: sqleditor-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  mariadb:
    image: mariadb:10
    container_name: sqleditor-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: sirket_db
      MARIADB_USER: mariadbuser
      MARIADB_PASSWORD: mariadbpassword
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped

  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: sqleditor-dynamodb
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports:
      - "8000:8000"
    restart: unless-stopped

  arangodb:
    image: arangodb:latest
    container_name: sqleditor-arangodb
    environment:
      - ARANGO_NO_AUTH=1
    ports:
      - "8529:8529"
    volumes:
      - arangodb_data:/var/lib/arangodb3
    restart: unless-stopped

  neptune:
    image: tinkerpop/gremlin-server:latest
    container_name: sqleditor-neptune
    ports:
      - "8182:8182"
    restart: unless-stopped

  hbase:
    image: harisekhon/hbase:latest
    container_name: sqleditor-hbase
    ports:
      - "16000:16000"
      - "16010:16010"
      - "16020:16020"
      - "2181:2181"
    restart: unless-stopped

  couchdb:
    image: couchdb:latest
    container_name: sqleditor-couchdb
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
    ports:
      - "5984:5984"
    volumes:
      - couchdb_data:/opt/couchdb/data
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  oracle_data:
    driver: local
  mssql_data:
    driver: local
  postgres_data:
    driver: local
  arangodb_data:
    driver: local
  couchdb_data:
    driver: local
  mariadb_data:
    driver: local
  mongodb_data:
    driver: local

secrets:
  db_root_password:
    file: ./secrets/db_root_password.txt
  db_password:
    file: ./secrets/db_password.txt
